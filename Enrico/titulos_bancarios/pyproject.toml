[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pense-alm-titulos-bancarios"
version = "0.1.0"
description = "Modulo de titulos bancarios (CDB, LCI, LCA, LF, DPGE) do Pense Alem"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
