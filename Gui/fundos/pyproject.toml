[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pense-alm-fundos"
version = "0.1.0"
description = "Base do modulo de Fundos (FIDC, FIC-FIDC, FIAGRO) do Pense Alem"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
